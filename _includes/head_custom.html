<script>
  /* Run early to prevent FOUC */
  (function() {
    let savedTheme = localStorage.getItem("theme");
    if (savedTheme) {
      let cssFile = document.querySelector('link[href*="just-the-docs-"]');
      if (cssFile) {
        let currentHref = cssFile.getAttribute('href');
        let newHref = currentHref.replace(/just-the-docs-.*\.css/, 'just-the-docs-' + savedTheme + '.css');
        cssFile.setAttribute('href', newHref);
      }
    }
  })();

  /* DOM loaded toggle logic */
  document.addEventListener("DOMContentLoaded", function() {
    let defaultTheme = "dark";
    let currentTheme = localStorage.getItem("theme") || defaultTheme;

    function updateThemeIcons() {
      let sunIcon = document.getElementById("theme-icon-sun");
      let moonIcon = document.getElementById("theme-icon-moon");
      if (sunIcon && moonIcon) {
        if (currentTheme === "dark") {
          sunIcon.style.display = "block";
          moonIcon.style.display = "none";
        } else {
          sunIcon.style.display = "none";
          moonIcon.style.display = "block";
        }
      }
    }

    function setTheme(theme) {
      currentTheme = theme;
      localStorage.setItem("theme", theme);
      
      let cssFile = document.querySelector('link[href*="just-the-docs-"]');
      if (cssFile) {
        let currentHref = cssFile.getAttribute('href');
        let newHref = currentHref.replace(/just-the-docs-.*\.css/, 'just-the-docs-' + theme + '.css');
        cssFile.setAttribute('href', newHref);
      }
      
      if (typeof jtd !== 'undefined' && jtd.setTheme) {
        jtd.setTheme(theme);
      }
      updateThemeIcons();
    }

    if (currentTheme !== defaultTheme) {
      setTheme(currentTheme);
    } else {
      updateThemeIcons();
    }
    
    let toggleBtn = document.getElementById("theme-toggle");
    if (toggleBtn) {
      toggleBtn.addEventListener("click", function() {
        if (currentTheme === "dark") {
          setTheme("light");
        } else {
          setTheme("dark");
        }
      });
    }
  });
</script>
